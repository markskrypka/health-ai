[project]
name = "clinic-agent"
version = "0.1.0"
description = "Voice agent answering scheduling calls for Clínica Arenal (HackSpain 2026, Prosper track)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pipecat-ai[deepgram,google,silero,websocket,runner]==1.11.0",
    "google-genai",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "tzdata",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
