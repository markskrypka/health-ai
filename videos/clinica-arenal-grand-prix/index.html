<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #ffffff;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="180"
      data-width="1920"
      data-height="1080"
      data-layout-allow-overlap
    >
      <div
        id="el-01-hook"
        class="scene"
        data-composition-id="01-hook"
        data-composition-src="compositions/frames/01-hook.html"
        data-start="0"
        data-duration="25"
        data-track-index="0"
      ></div>
      <audio
        id="el-01-hook-voice"
        src="audio/voice-01.mp3"
        data-start="0"
        data-duration="23.21"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-02-patient-screen"
        class="scene"
        data-composition-id="02-patient-screen"
        data-composition-src="compositions/frames/02-patient-screen.html"
        data-start="24.5"
        data-duration="24"
        data-track-index="1"
      ></div>
      <audio
        id="el-02-patient-screen-voice"
        src="audio/voice-02.mp3"
        data-start="24.5"
        data-duration="22.21"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-03-desk-overview"
        class="scene"
        data-composition-id="03-desk-overview"
        data-composition-src="compositions/frames/03-desk-overview.html"
        data-start="48"
        data-duration="21"
        data-track-index="0"
      ></div>
      <audio
        id="el-03-desk-overview-voice"
        src="audio/voice-03.mp3"
        data-start="48"
        data-duration="19.21"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-04-explainability"
        class="scene"
        data-composition-id="04-explainability"
        data-composition-src="compositions/frames/04-explainability.html"
        data-start="68.5"
        data-duration="23"
        data-track-index="1"
      ></div>
      <audio
        id="el-04-explainability-voice"
        src="audio/voice-04.mp3"
        data-start="68.5"
        data-duration="21.22"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-05-insights"
        class="scene"
        data-composition-id="05-insights"
        data-composition-src="compositions/frames/05-insights.html"
        data-start="91"
        data-duration="22"
        data-track-index="0"
      ></div>
      <audio
        id="el-05-insights-voice"
        src="audio/voice-05.mp3"
        data-start="91"
        data-duration="20.21"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-06-pipelines"
        class="scene"
        data-composition-id="06-pipelines"
        data-composition-src="compositions/frames/06-pipelines.html"
        data-start="112.5"
        data-duration="23.5"
        data-track-index="1"
      ></div>
      <audio
        id="el-06-pipelines-voice"
        src="audio/voice-06.mp3"
        data-start="112.5"
        data-duration="21.7"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-07-concurrency"
        class="scene"
        data-composition-id="07-concurrency"
        data-composition-src="compositions/frames/07-concurrency.html"
        data-start="135.5"
        data-duration="23"
        data-track-index="0"
      ></div>
      <audio
        id="el-07-concurrency-voice"
        src="audio/voice-07.mp3"
        data-start="135.5"
        data-duration="21.2"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-08-rigour-outro"
        class="scene"
        data-composition-id="08-rigour-outro"
        data-composition-src="compositions/frames/08-rigour-outro.html"
        data-start="158"
        data-duration="22"
        data-track-index="1"
      ></div>
      <audio
        id="el-08-rigour-outro-voice"
        src="audio/voice-08.mp3"
        data-start="158"
        data-duration="20.7"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <!-- BGM -->
      <audio
        id="el-bgm"
        src="audio/bgm.loop.mp3"
        data-start="0"
        data-duration="180"
        data-track-index="11"
        data-volume="0.07"
      ></audio>

      <!-- captions -->
      <div
        id="el-captions"
        class="scene"
        data-track-kind="captions"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-start="0"
        data-duration="180"
        data-track-index="2"
      ></div>

      <!-- SFX -->
      <audio
        id="el-sfx-0"
        src="audio/whoosh-cinematic.mp3"
        data-start="0.1"
        data-duration="2"
        data-track-index="20"
        data-volume="0.35"
      ></audio>
      <audio
        id="el-sfx-1"
        src="audio/sparkle.mp3"
        data-start="24.8"
        data-duration="1"
        data-track-index="21"
        data-volume="0.25"
      ></audio>
      <audio
        id="el-sfx-2"
        src="audio/notification.mp3"
        data-start="48.3"
        data-duration="1"
        data-track-index="22"
        data-volume="0.25"
      ></audio>
      <audio
        id="el-sfx-3"
        src="audio/click.mp3"
        data-start="68.8"
        data-duration="0.37"
        data-track-index="23"
        data-volume="0.2"
      ></audio>
      <audio
        id="el-sfx-4"
        src="audio/chime.mp3"
        data-start="91.3"
        data-duration="1"
        data-track-index="24"
        data-volume="0.25"
      ></audio>
      <audio
        id="el-sfx-5"
        src="audio/click.mp3"
        data-start="112.8"
        data-duration="0.37"
        data-track-index="25"
        data-volume="0.2"
      ></audio>
      <audio
        id="el-sfx-6"
        src="audio/whoosh-cinematic.mp3"
        data-start="135.6"
        data-duration="2"
        data-track-index="26"
        data-volume="0.3"
      ></audio>
      <audio
        id="el-sfx-7"
        src="audio/chime.mp3"
        data-start="158.3"
        data-duration="1.5"
        data-track-index="27"
        data-volume="0.35"
      ></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-hook", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 24.5);
        tl.fromTo("#el-02-patient-screen", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 24.5);
        tl.to("#el-02-patient-screen", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 48.0);
        tl.fromTo("#el-03-desk-overview", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 48.0);
        tl.to("#el-03-desk-overview", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 68.5);
        tl.fromTo("#el-04-explainability", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 68.5);
        tl.to("#el-04-explainability", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 91.0);
        tl.fromTo("#el-05-insights", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 91.0);
        tl.to("#el-05-insights", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 112.5);
        tl.fromTo("#el-06-pipelines", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 112.5);
        tl.to("#el-06-pipelines", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 135.5);
        tl.fromTo("#el-07-concurrency", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 135.5);
        tl.to("#el-07-concurrency", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 158.0);
        tl.fromTo("#el-08-rigour-outro", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 158.0);
        tl.to({}, { duration: 180 }, 0); // full-span anchor — exactly 180.0s (3 minutes)
      })();
    </script>
  </body>
</html>
